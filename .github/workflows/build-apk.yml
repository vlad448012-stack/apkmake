name: Build APK from Python

on:
  workflow_dispatch:
    inputs:
      python_code:
        description: 'Your Python/Kivy code (Base64 encoded)'
        required: true
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save Python code
        run: |
          echo '${{ github.event.inputs.python_code }}' | base64 -d > main.py

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: ${{ steps.buildozer.outputs.filename }}
